<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Enterprise 토큰 관리</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Claude Enterprise 토큰 관리</h1>
    <div id="user-info" class="user-info hidden">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn btn-ghost">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <div id="banner" class="banner hidden"></div>

    <!-- 1단계: 이메일 입력 -->
    <section id="view-email" class="card">
      <h2>로그인</h2>
      <p class="muted">소속 조직의 이메일을 입력하면, 조직 구성원인 경우 인증코드를 보내드립니다.</p>
      <form id="form-email">
        <label for="input-email">이메일</label>
        <input id="input-email" type="email" required placeholder="you@company.com" autocomplete="email" />
        <button type="submit" class="btn btn-primary">인증코드 받기</button>
      </form>
    </section>

    <!-- 2단계: 인증코드 입력 -->
    <section id="view-otp" class="card hidden">
      <h2>인증코드 확인</h2>
      <p class="muted"><span id="otp-email"></span> 로 발송된 6자리 인증코드를 입력하세요.</p>
      <form id="form-otp">
        <label for="input-code">인증코드</label>
        <input id="input-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" required placeholder="000000" autocomplete="one-time-code" />
        <button type="submit" class="btn btn-primary">확인</button>
      </form>
      <button id="btn-resend" class="btn btn-link">인증코드 다시 받기</button>
      <button id="btn-back-email" class="btn btn-link">이메일 다시 입력</button>
    </section>

    <!-- 3단계: 대시보드 -->
    <section id="view-dashboard" class="hidden">
      <div class="dashboard-header">
        <h2>조직 구성원 토큰 제한</h2>
        <button id="btn-refresh" class="btn btn-secondary">새로고침</button>
      </div>
      <p class="muted">
        금액은 조직 결제 통화 기준입니다. "그룹 기준"은 해당 멤버가 속한 그룹에 설정된 한도이며, 개인별 제한을 설정하면 그룹/등급 기준을 덮어씁니다.
      </p>
      <div class="table-wrap">
        <table id="members-table">
          <thead>
            <tr>
              <th>이름</th>
              <th>이메일</th>
              <th>소속 그룹</th>
              <th>그룹 기준 제한</th>
              <th>현재 적용 제한 (출처)</th>
              <th>이번 기간 사용액</th>
              <th>개인별 제한 설정</th>
            </tr>
          </thead>
          <tbody id="members-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
